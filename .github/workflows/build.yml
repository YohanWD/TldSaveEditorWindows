# Builds the single-file TldSaveEditor.exe.
# - Pushing a tag like v1.2.0: build, then create a GitHub Release with the zip, using the tag as version.
# - "Run workflow" button (Actions tab): test build only, exe attached to the run under Artifacts.
#
# Security: actions are pinned to a commit SHA (a tag can be moved to other code, a commit can't).
# The version each SHA points to is in the comment. Only the release job can write to the repository.

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Default for every job: read-only
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          # v1.2.0 tag -> 1.2.0; otherwise keep the version from the csproj
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            "args=-p:Version=$version" >> $env:GITHUB_OUTPUT
          } else {
            $version = ([xml](Get-Content src/TldSaveEditor/TldSaveEditor.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            "args=" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build solution
        run: dotnet build TldSaveEditor.slnx -c Release

      - name: Publish exe
        run: dotnet publish src/TldSaveEditor -p:PublishProfile=win-x64 ${{ steps.version.outputs.args }}

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/win-x64/TldSaveEditor.exe, README.md, THIRD_PARTY_NOTICES.md `
            -DestinationPath "publish/TldSaveEditor-${{ steps.version.outputs.version }}-win-x64.zip"

      # The exe on its own, for test builds (Actions tab > run > Artifacts)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TldSaveEditor-${{ steps.version.outputs.version }}-win-x64
          path: publish/win-x64/TldSaveEditor.exe

      # The release zip, handed to the release job
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release-zip
          path: publish/TldSaveEditor-${{ steps.version.outputs.version }}-win-x64.zip

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; only this job gets write access

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: TldSaveEditor-${{ needs.build.outputs.version }}-win-x64.zip
          generate_release_notes: true
